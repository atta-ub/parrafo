[project]
name = "parrafo"
version = "0.1.0"
description = "A Spanish paragraph and its English translation, every hour, in your terminal."
requires-python = ">=3.11"
dependencies = ["rich>=13", "typer>=0.9", "requests>=2.28"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
parrafo = "parrafo.cli:app"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["parrafo*"]
